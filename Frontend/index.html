<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Anomaly Detection Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    
    <div id="flash"></div>

    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="login-wrap">
        <div class="glass">
          <div class="session-tag">Secure session</div>
          <div class="login-logo">🛡️</div>

          <div class="text-center mb-1" style="font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mint-deep);">
            ● Network Traffic Analysis
          </div>
          <h2 class="text-center animated-title mb-3">Welcome back</h2>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input name="username" id="username" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="password-wrap">
                <input name="password" id="password" type="password" class="form-control" required>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                  <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  <svg id="eyeOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 8 11 8a13.16 13.16 0 0 1-3.05 3.94M6.61 6.61A13.526 13.526 0 0 0 1 12s4 8 11 8a9.74 9.74 0 0 0 5.39-1.61"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>
                </button>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-success" type="submit" id="loginBtn">Login</button>
            </div>
          </form>

          <div class="mt-3 small text-muted">
            Demo user: <strong style="color:var(--text);">admin</strong> / <strong style="color:var(--text);">admin123</strong>
          </div>
        </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Password visibility toggle — self-contained, doesn't touch login.js's auth logic
    document.getElementById("togglePassword").addEventListener("click", function () {
      const pwd = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");
      const eyeOffIcon = document.getElementById("eyeOffIcon");
      const showing = pwd.type === "password";
      pwd.type = showing ? "text" : "password";
      eyeIcon.style.display = showing ? "none" : "block";
      eyeOffIcon.style.display = showing ? "block" : "none";
      this.setAttribute("aria-label", showing ? "Hide password" : "Show password");
    });
  </script>

  <script src="env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
