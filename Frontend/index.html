<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — Anomaly Detection Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">

    <div class="api-bar">
      <span>Backend API:</span>
      <input id="apiUrlInput" class="form-control form-control-sm" type="text" placeholder="https://your-backend.onrender.com">
      <button id="apiUrlSave" class="btn btn-sm btn-outline-light">Save</button>
      <span id="apiStatus" class="api-status"><span class="dot"></span><span id="apiStatusText">checking…</span></span>
    </div>

    <div id="flash"></div>

    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="glass">
          <div class="text-center mb-3" style="font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mint-deep);">
            ● Network Traffic Analysis
          </div>
          <h2 class="text-center animated-title mb-3">Welcome back</h2>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input name="username" id="username" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input name="password" id="password" type="password" class="form-control" required>
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-success" type="submit" id="loginBtn">Login</button>
            </div>
          </form>

          <div class="mt-3 small text-muted">
            Demo user: <strong style="color:var(--text);">admin</strong> / <strong style="color:var(--text);">admin123</strong>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="env.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
